name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      #- name: 🔍 Run Lint
      #  run: npm run lint # really needed?

      - name: Run Build
        run: npm run build

      # - name: Run Tests
      #   run: npm run test

      - name: Upload Build Artifact (für spätere Schritte/Releases)
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
